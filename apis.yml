aid: kubeark
name: Kubeark
description: >-
  Kubeark is an enterprise orchestration and AI automation platform that standardizes
  system integration across hybrid estates. It combines three surfaces: workflow
  automation, where technical teams and end users build language-agnostic workflows and
  long-running jobs from a node-based editor; integration, which connects existing
  systems, SaaS applications, databases and internal APIs through prebuilt connectors and
  actions; and agentic automation, which deploys autonomous AI agents that can run
  on-premise for compliance-sensitive environments. The platform operates on two
  perspectives, a Kubernetes perspective covering clusters, templates and deployments, and
  a Terraform-centric infrastructure perspective for provisioning. Kubeark bundles its own
  identity provider, Kubeark Identity, supporting SAML2, LDAP, OAuth2, OIDC and SCIM, plus
  local and global vaults for secrets. It ships as self-hosted, cloud, hybrid or
  on-premises software licensed by number of templates and clusters, and publishes no
  public API, OpenAPI description or SDKs.
